[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-broadcast-boundaries"
version = "1.0.0"
description = "Controlled modular-agent task and routing diagnostics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "torch>=2.0",
]

[project.optional-dependencies]
orchestrator = [
  "openai-codex==0.144.4",
  "PyYAML==6.0.2",
  "pytest==9.1.1",
  "tomli==2.4.1; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
